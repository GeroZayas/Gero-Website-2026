{% macro blog_post_card(link, title, tags, picture, created_at,
classes="items-center flex max-w-l overflow-hidden rounded-lg bg-linear-to-r from-white to-slate-50 transition-all
duration-300 ease-in-out border border-gray-100"
)%}

<div class="{{classes}}">
    <div class="w-10 shrink-0">
        <a href="blog/{{link}}">
            <img src="{{picture}}" alt="Card image"
                class="object-cover object-center transition-transform duration-300 hover:scale-105" />
        </a>
    </div>

    <div class="p-2">
        <a href="blog/{{link}}"
            class="font-bold text-md text-red-700 transition-all duration-300 ease-in-out hover:underline hover:text-red-900">
            {{title}}
        </a>
        <p class="mt-2 text-xs text-gray-600">{{tags}}</p>
        <p class="text-xs text-yellow-600">{{created_at}}</p>
    </div>
</div>
{% endmacro %}
