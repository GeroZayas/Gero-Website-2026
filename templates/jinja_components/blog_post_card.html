{% macro blog_post_card(link, title, tags, picture, created_at,
    classes="items-center flex max-w-l overflow-hidden rounded border border-gray-100 shadow-sm hover:shadow-md transition-shadow bg-white"
    )%}

<div class="{{classes}}">
  <div class="lg:w-40 w-30 shrink-0">
    <a href="blog/{{link}}">
      <img
        src="{{picture}}"
        alt="Card image"
        class="aspect-square object-cover object-center transition-transform duration-300 hover:scale-105"
      />
    </a>
  </div>

  <div class="md:p-5 p-2">
    <a
      href="blog/{{link}}"
      class="lg:text-2xl text-md text-red-700 hover:text-red-900 hover:underline"
    >
      {{title}}
    </a>
    <p class="mt-2 lg:text-sm text-xs text-gray-600">{{tags}}</p>
    <p class="lg:text-sm text-xs text-yellow-600">{{created_at}}</p>
  </div>
</div>
{% endmacro %}
