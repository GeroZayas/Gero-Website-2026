{% macro project_card(link, title, tags, picture, description,
classes="items-center flex max-w-l overflow-hidden rounded bg-slate-50"
)%}

<div class="{{classes}}">
    <div class="w-20 shrink-0">
        <a target="_blank" href="{{link}}">
            <img src="{{picture}}" alt="Card image"
                class="object-cover object-center transition-transform duration-300 hover:scale-105" />
        </a>
    </div>

    <div class="md:p-2 p-2">
        <a target="_blank" href="{{link}}"
            class="lg:text-2xl font-bold text-md text-cyan-700 hover:text-cyan-900 hover:underline">
            {{title}}
        </a>
        <p class="mt-2 lg:text-sm text-xs text-slate-600">{{description}}</p>
        <br>
        <p class="mt-2 lg:text-sm text-xs text-yellow-600">{{tags}}</p>
    </div>
</div>
{% endmacro %}
