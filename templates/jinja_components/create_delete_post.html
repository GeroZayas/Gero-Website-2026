<div ">
    <p data-show=" $isLocal" class="bg-gray-100 text-slate-600">⚠️ This is only shown when
    <pre data-show="$isLocal"
        class="text-xs bg-gray-700 text-yellow-300"><code>window.location.host === '0.0.0.0:8000'</code></pre>
    </p>
    <div data-show="$isLocal" class="w-auto mt-4 mb-4 items-center bg-slate-100 flex gap-4 p-2 border-2 border-gray-200">
        <div>
            <button
                class="text-sm bg-sky-700 hover:bg-sky-600 text-white py-1 px-2 border-b-4 border-sky-900 hover:border-sky-700 rounded">
                <a href="/blog-post-creator">Create
                    new
                    post</a>
                </a>
            </button>
        </div>

        <div class="flex items-center justify-between gap-2">
            <button
                data-on:click="@post('/blog-post-creator-delete-post/' + $blogPostIdDelete); window.location.reload();"
                class="text-sm bg-red-700 hover:bg-red-600 text-white py-1 px-2 border-b-4 border-red-900 hover:border-red-700 rounded">Delete
                post</button>
            <input class="bg-white border w-20 border-gray-200 rounded " data-bind:blog-post-id-delete type="number">
        </div>
    </div>
</div>
