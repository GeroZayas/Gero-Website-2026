<div class="mt-2 mb-6">
    <div id="blog-post-body" class="
    flex min-w-0 w-full max-w-full flex-col gap-3

    [&_h1]:text-3xl
    [&_h1]:text-red-600

    [&_h2]:text-2xl
    [&_h2]:text-yellow-600

    [&_.codehilite]:min-w-0
    [&_.codehilite]:max-w-full

    [&_hr]:my-4
    [&_hr]:h-px
    [&_hr]:w-full
    [&_hr]:border-0
    [&_hr]:bg-gradient-to-r
    [&_hr]:from-transparent
    [&_hr]:via-slate-300
    [&_hr]:to-transparent

    [&_blockquote]:rounded-r-lg
    [&_blockquote]:border-l-4
    [&_blockquote]:border-slate-400
    [&_blockquote]:bg-slate-50
    [&_blockquote]:px-4
    [&_blockquote]:italic
    [&_blockquote]:leading-relaxed
    [&_blockquote]:text-slate-700
    
    [&_pre]:mt-2
    [&_pre]:min-w-0
    [&_pre]:max-w-full
    [&_pre]:overflow-x-auto
    [&_pre]:rounded-xl
    [&_pre]:bg-slate-900
    [&_pre]:p-4
    [&_pre]:text-sm
    [&_pre]:leading-relaxed
    [&_pre]:text-slate-100
    [&_pre]:shadow-sm
    [&_pre]:ring-1
    [&_pre]:ring-slate-800

    [&_code]:rounded
    [&_code]:bg-slate-100
    [&_code]:px-1.5
    [&_code]:py-0.5
    [&_code]:font-mono
    [&_code]:text-sm
    [&_code]:text-rose-600

    [&_pre_code]:bg-transparent
    [&_pre_code]:p-0

    [&_table]:w-full

    [&_table]:ring-1

    [&_table]:rounded-xl
    [&_table]:bg-white

    [&_thead]:bg-slate-50

    [&_thead]:text-slate-600

    [&_th]:px-4

    [&_th]:font-semibold

    [&_tbody]:divide-y
    [&_tbody]:divide-slate-200

    [&_tr:hover]:bg-slate-50

    [&_td]:px-4
    [&_td]:py-3

    [&_ul]:list-disc
    [&_ul]:space-y-2
    [&_ul]:pl-5
    [&_ul]:text-slate-700
    [&_ul_li::marker]:text-slate-400

    [&_ol]:list-decimal
    [&_ol]:space-y-2
    [&_ol]:pl-6
    [&_ol]:text-slate-700
    [&_ol_li::marker]:font-semibold
    [&_ol_li::marker]:text-blue-800
  ">
        <!-- {{blog_post.content}} -->
        {% include blog_post.id ~ ".html"%}
    </div>
</div>

{% endblock %}
