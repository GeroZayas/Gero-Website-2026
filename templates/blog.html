{% extends "base.html" %} {% block title %} Blog {% endblock %} {% block content
%}

<div class="">
  <h1 class="text-3xl">Blog</h1>
</div>

<div class="">
  <p>Blog posts.</p>
  {% for post in blog_posts %}
  <h2 class="text-2xl text-red-700">{{ post["title"] }}</h2>
  <h4 class="text-slate-600">{{ post["content"][:25] }}...</h4>
  <p class="text-yellow-600">CREATED AT {{ post["created_at"]}}</p>
  {% endfor %}
</div>

{% endblock %}
