{% extends "base.html" %} {% block title %} Projects {% endblock %} {% block content
%}


<div class="mt-2 mb-2">
    <h1 class="text-3xl">CREATE A NEW PROJECT</h1>
</div>

<div class="flex flex-col gap-3">
    <h3 class="text-2xl text-slate-500">INSERT NAME</h3>
    <input data-bind:project-creator-name id="project-creator-name" type="text"
        class="w-full min-w-0 rounded-lg border border-slate-300 bg-white px-3 py-2 text-base text-slate-900 placeholder:text-slate-400 shadow-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500">


    <h3 class="text-2xl text-slate-700">INSERT DESCRIPTION</h3>
    <textarea data-bind:project-creator-description id="project-creator-description" placeholder="Description..."
        class="w-full min-w-0 rounded-lg border border-slate-300 bg-white px-3 py-2 text-base text-slate-900 placeholder:text-slate-400 shadow-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500">
    </textarea>

    <h3 class="text-2xl text-red-500">INSERT TAGS (separated by commas)</h3>
    <input data-bind:project-creator-tags id="project-creator-tags" type="text"
        class="w-full min-w-0 rounded-lg border border-slate-300 bg-white px-3 py-2 text-base text-slate-900 placeholder:text-slate-400 shadow-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500">

    <h3 class="text-2xl text-red-700">INSERT LINK</h3>
    <input data-bind:project-creator-link id="project-creator-link" type="text"
        class="w-full min-w-0 rounded-lg border border-slate-300 bg-white px-3 py-2 text-base text-slate-900 placeholder:text-slate-400 shadow-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500">

    <!-- ---------------- SUBMIT BUTTON ---------------- -->
    <button class="w-50 bg-slate-500 hover:bg-slate-700 text-white font-bold py-2 px-4 rounded"
        data-on:click="@post('/project-creator-submit-content'); @setAll('')">Submit</button>

</div>

{% endblock %}
