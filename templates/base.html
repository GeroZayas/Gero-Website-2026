<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>{% block title %}Gero Zayas{% endblock %}</title>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Gero Zayas Website" />
    <link rel="icon" href="/static/images/favicon.ico" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="/static/style.css" />
    <!-- Cargamos Datastar desde CDN -->
    <script
      type="module"
      src="https://cdn.jsdelivr.net/gh/starfederation/datastar@v1.0.5/bundles/datastar.js"
    ></script>
    <script src="static/components/specialHeader.js"></script>
  </head>
  <style></style>
  <!-- ---------------------- BODY ---------------------- -->
  <body class="max-w-4xl mx-auto p-2 min-h-screen flex flex-col">
    <header class="flex justify-between border border-gray-100 rounded">
      <div class="" id="header-title-text">Gero Zayas's Web Home</div>
      <nav class="normal-menu another-class">
        <a class="header-button hover:bg-gray-200 hover:text-red-700" href="/"
          >Home</a
        >
        <!-- <a href="/about">About</a> -->
        <a
          class="header-button hover:bg-gray-200 hover:text-red-700"
          href="/blog"
          >Blog</a
        >
        <a
          class="header-button hover:bg-gray-200 hover:text-red-700"
          href="/projects"
          >Projects</a
        >
      </nav>
    </header>
    <main class="flex-1">{% block content %} {% endblock %}</main>

    <footer class="w-full">
      <div class="">
        <a
          href="https://github.com/GeroZayas"
          class="gap-2 justify-center items-center text-center bg-slate-200 hover:bg-slate-300 flex"
          >Find me on <span class="font-bold">Gero Zayas</span>
          <img
            class="w-4"
            src="/static/images/icons8-github-30.png"
            alt=""
          />GitHub</a
        >
      </div>

      <div
        class="gap-2 max-w-6xl mx-auto flex justify-center p-2 border bg-gray-800 text-yellow-500"
      >
        Handmade mit Liebe by <b>Gero Zayas</b>
      </div>
    </footer>

    <script src="/static/script.js"></script>
  </body>
</html>
