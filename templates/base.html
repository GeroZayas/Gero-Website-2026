<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>{% block title %}Gero Zayas{% endblock %}</title>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Gero Zayas Website" />
    <link rel="icon" href="/static/images/favicon.ico" />
    <!-- Cargamos Datastar desde CDN -->
    <script
      type="module"
      src="https://cdn.jsdelivr.net/gh/starfederation/datastar@v1.0.2/bundles/datastar.js"
    ></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css"
    />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <style></style>

  <body>
    <header>
      <div id="header-title-text">Gero Zayas's Web Home</div>
      <nav class="normal-menu another-class">
        <a class="header-button" href="/">Home</a>
        <!-- <a href="/about">About</a> -->
        <a class="header-button" href="/blog">Blog</a>
        <a class="header-button" href="/projects">Projects</a>
      </nav>
    </header>
    <main>{% block content %} {% endblock %}</main>

    <footer>Handmade mit Liebe by <b> Gero Zayas</b></footer>

    <script src="/static/script.js"></script>
  </body>
</html>
